name: Build iOS
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: xcodebuild -project CounterApp.xcodeproj -scheme CounterApp -destination generic/platform=iOS -configuration Release CODE_SIGNING_ALLOWED=NO build
